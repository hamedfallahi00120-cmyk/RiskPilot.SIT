[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpilot-core"
version = "0.1.0"
description = "Broker-agnostic position sizing and daily-risk guarding for forex and futures accounts."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "RiskPilot maintainers" }]
keywords = ["trading", "risk", "position-sizing", "forex", "futures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
riskpilot = "riskpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskpilot = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".git", "build", "dist"]

[tool.ruff.lint]
select = [
  "ANN", # annotations
  "ARG", # unused arguments
  "B",   # bugbear
  "C4",  # comprehensions
  "D",   # docstrings
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PTH", # pathlib
  "RET", # return statements
  "RUF", # ruff-specific
  "SIM", # simplify
  "T20", # no print statements
  "TID", # tidy imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "D203", # conflicts with D211
  "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"src/riskpilot/cli.py" = ["T20", "ARG"]
"tests/*" = ["ANN", "D", "ARG", "PTH"]
"docs/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = false
pretty = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=riskpilot --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["riskpilot"]
omit = []

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
